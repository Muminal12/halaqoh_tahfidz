name: Build Halaqoh Tahfidz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q halaqoh_tahfidz_fixed.zip -d project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: project/halaqoh_tahfidz_fixed
        run: flutter pub get

      - name: Build APK
        working-directory: project/halaqoh_tahfidz_fixed
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halaqoh-tahfidz-apk
          path: project/halaqoh_tahfidz_fixed/build/app/outputs/flutter-apk/app-release.apk
